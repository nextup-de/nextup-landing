# Weekly dependency updates as PRs; CI runs on each and Kevin merges. Security fixes arrive
# immediately regardless. Same policy as the app repo (selluxhenner/nextup).
#
# Kevin owns this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions (Next, React, ...) change behaviour: those are upgraded by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]
