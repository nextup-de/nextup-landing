# CI for the public NextUp site. Both jobs must pass before a PR can merge.
#   guard — no secrets / forbidden files (this repo is public)
#   site  — npm ci, npm audit (prod, high+), lint, typecheck, unit tests, production build
#
# Kevin owns this file.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: guard · secrets & forbidden files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block forbidden files
        shell: bash
        run: |
          fail=0
          FORBIDDEN='(^|/)\.env($|\.)|\.pem$|\.key$|\.p12$|\.pfx$|(^|/)id_rsa|(^|/)id_ed25519|credentials.*\.json$|service-?account.*\.json$|(^|/)node_modules/|\.sqlite3?$|\.db$'
          while IFS= read -r f; do
            [ "$f" = ".env.example" ] && continue
            if echo "$f" | grep -Eiq "$FORBIDDEN"; then
              echo "::error file=$f::Forbidden file: $f (this repo is public)"
              fail=1
            fi
          done < <(git ls-files)
          exit $fail

      # The open-source gitleaks scanner (MIT) itself. Its GitHub Action wants a paid licence for
      # organization repos since the move to nextup-de; the scanner needs none. A pinned version,
      # checked against the release's own checksum list.
      - name: Secret scan (gitleaks)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          # The commits this run brings in, as the action scanned them: a PR's own, or a push's.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" "$url/$tgz"
          curl -fsSL -o "$RUNNER_TEMP/sums.txt" "$url/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $tgz\$" sums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
          range=HEAD
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$range" .

  site:
    name: site · lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Known vulnerabilities in what ships (dependencies, not devDependencies): high+ fails.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
