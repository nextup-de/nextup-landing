# nginx site for the public site on the shared Hetzner box -> the container on 127.0.0.1:3151.
# Install (deploy/README.md):
#   sudo cp nginx-sellux.ch.conf /etc/nginx/sites-available/nextup-landing
#   sudo ln -s /etc/nginx/sites-available/nextup-landing /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sellux.ch -d www.sellux.ch    # adds TLS + the http->https redirect

# www is only an alias: send it to the one real name.
server {
    listen 80;
    listen [::]:80;
    server_name www.sellux.ch;
    return 301 https://sellux.ch$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sellux.ch;

    # The contact form is the only thing that posts, and it is small.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3151;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the form's rate limit trusts the first X-Forwarded-For entry.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
